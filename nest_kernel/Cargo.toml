[package]
name = "nest_kernel"
version = "0.1.0"
edition = "2021"

[lib]
# staticlib: everything Rust needs is archived into one .a that the add-in
# links directly. No second binary to ship, nothing to dlopen, and no runtime
# dependency on Fusion's process layout.
#
# rlib alongside it so the crate's own tests and `examples/probe.rs` can link
# it. A staticlib cannot be depended on from Rust, and the probe is how the
# sheet layer gets exercised without Fusion in the loop. Nothing ships it.
crate-type = ["staticlib", "rlib"]

[dependencies]
# sparrow is NOT on crates.io (the crate of that name there is unrelated), and
# it has no [lib] section -- but it ships src/lib.rs, which cargo auto-detects.
#
# VENDORED, not a git dependency: sheet nesting needs locked items and a
# movables-only width objective, neither of which upstream can express. The
# snapshot, its pinned rev and every patch are recorded in
# ../vendor/sparrow/UPSTREAM.md.
sparrow = { path = "../vendor/sparrow" }
jagua-rs = { version = "=1.1.0", features = ["spp"] }
serde_json = "1.0"
# sparrow narrates its own search through `log` -- every shrink, every failed
# separation, every compression attempt. A GUI process has no stderr, so those
# lines went nowhere; this crate lets us install a sink and forward them to the
# add-in's log file instead of reinventing the instrumentation.
log = "0.4"
rand = "0.10"

[profile.release]
opt-level = 3
codegen-units = 1
# panic = "abort" is deliberately NOT set: catch_unwind needs unwinding, and
# every FFI entry point is wrapped so a Rust panic can never unwind into C++
# (undefined behaviour) or reach Fusion (process abort).
panic = "unwind"
